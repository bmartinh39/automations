name: Deploy website and twin

on:
  push:
    branches:
      - main

concurrency:
  group: production-deployment
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_HOST: ${{ vars.VPS_HOST }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts

      - name: Deploy to VPS
        env:
          VPS_HOST: ${{ vars.VPS_HOST }}
          VPS_USER: ${{ vars.VPS_USER }}
        run: |
          ssh "$VPS_USER@$VPS_HOST" '
            set -eu
            cd /opt/apps/automations
            git fetch origin main
            git reset --hard origin/main

            # Reuse cached layers and recreate only the twin when needed.
            docker compose up -d --build --no-deps twin

            # Confirm the app responds without making a model request.
            for attempt in $(seq 1 30); do
              if docker compose exec -T twin /app/.venv/bin/python -c "from urllib.request import urlopen; assert urlopen(\"http://127.0.0.1:7860/\", timeout=2).status == 200" >/dev/null 2>&1; then
                echo "Twin startup check passed"
                exit 0
              fi
              sleep 2
            done

            echo "Twin did not become ready before the startup check timed out" >&2
            exit 1
          '
