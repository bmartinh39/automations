name: Validate website

on:
  pull_request:
    branches:
      - main
    paths:
      - 'publicar/**'
      - 'AGENTS.md'
      - '.github/workflows/validate-site.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate local links and assets
        shell: bash
        run: |
          python3 - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          from urllib.parse import urlparse
          import sys

          root = Path('publicar')
          html_path = root / 'index.html'

          if not html_path.exists():
              print('ERROR: publicar/index.html does not exist')
              sys.exit(1)

          class SiteParser(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.ids = set()
                  self.refs = []

              def handle_starttag(self, tag, attrs):
                  attrs = dict(attrs)
                  if attrs.get('id'):
                      self.ids.add(attrs['id'])
                  for attr in ('href', 'src'):
                      value = attrs.get(attr)
                      if value:
                          self.refs.append((tag, attr, value))

          parser = SiteParser()
          parser.feed(html_path.read_text(encoding='utf-8'))

          errors = []
          for tag, attr, value in parser.refs:
              if value.startswith(('#', 'mailto:', 'tel:', 'data:', 'javascript:')):
                  if value.startswith('#') and len(value) > 1 and value[1:] not in parser.ids:
                      errors.append(f'Broken fragment: {value}')
                  continue

              parsed = urlparse(value)
              if parsed.scheme or value.startswith('//'):
                  continue

              local = value.split('?', 1)[0].split('#', 1)[0]
              if not local:
                  continue

              target = (html_path.parent / local).resolve()
              try:
                  target.relative_to(root.resolve())
              except ValueError:
                  errors.append(f'Path escapes publicar/: {value}')
                  continue

              if not target.exists():
                  errors.append(f'Missing local asset/link target: {value}')

          if errors:
              print('Website validation failed:')
              for error in errors:
                  print(f'- {error}')
              sys.exit(1)

          print(f'Validation passed: {len(parser.ids)} ids, {len(parser.refs)} references checked.')
          PY

      - name: Reject obvious placeholders
        shell: bash
        run: |
          if grep -RniE '(^|[^[:alnum:]_])(TODO|TBD)([^[:alnum:]_]|$)|LOREM IPSUM|example\.com' publicar/; then
            echo 'ERROR: placeholder content found in publicar/'
            exit 1
          fi

      - name: Confirm website entry point is non-empty
        shell: bash
        run: |
          test -s publicar/index.html
