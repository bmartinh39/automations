name: Validate website

on:
  pull_request:
    branches:
      - main
    paths:
      - 'publicar/**'
      - 'AGENTS.md'
      - '.github/workflows/validate-site.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate pages, links, assets and language metadata
        shell: bash
        run: |
          python3 - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          from urllib.parse import unquote, urlparse
          import sys

          root = Path('publicar').resolve()
          required = ('index.html', 'es/index.html', 'en/index.html')
          errors = []
          for name in required:
              if not (root / name).is_file() or not (root / name).stat().st_size:
                  errors.append(f'Missing or empty page: {name}')

          class SiteParser(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.ids = set()
                  self.refs = []
                  self.links = []
                  self.lang = None

              def handle_starttag(self, tag, attrs):
                  attrs = dict(attrs)
                  if tag == 'html':
                      self.lang = attrs.get('lang')
                  if tag == 'link':
                      self.links.append(attrs)
                  if attrs.get('id'):
                      self.ids.add(attrs['id'])
                  for attr in ('href', 'src'):
                      value = attrs.get(attr)
                      if value:
                          self.refs.append((tag, attr, value))

          pages = {}
          for html_path in root.rglob('*.html'):
              parser = SiteParser()
              parser.feed(html_path.read_text(encoding='utf-8'))
              pages[html_path.resolve()] = parser

          for html_path, parser in pages.items():
              name = html_path.relative_to(root)
              for tag, attr, value in parser.refs:
                  parsed = urlparse(value)
                  if parsed.scheme or parsed.netloc:
                      continue

                  local = unquote(parsed.path)
                  if not local:
                      target = html_path
                  elif local.startswith('/'):
                      target = (root / local.lstrip('/')).resolve()
                  else:
                      target = (html_path.parent / local).resolve()
                  if not target.is_relative_to(root):
                      errors.append(f'{name}: path escapes publicar/: {value}')
                      continue
                  if target.is_dir():
                      target /= 'index.html'
                  if not target.is_file():
                      errors.append(f'{name}: missing local asset/link target: {value}')
                  elif parsed.fragment and target in pages:
                      if unquote(parsed.fragment) not in pages[target].ids:
                          errors.append(f'{name}: broken fragment: {value}')
              print(f'{name}: {len(parser.ids)} ids, {len(parser.refs)} references checked.')

          for language in ('es', 'en'):
              name = f'{language}/index.html'
              parser = pages.get(root / name)
              if parser is None:
                  continue
              if parser.lang != language:
                  errors.append(f'{name}: expected HTML lang="{language}"')
              canonical = [link.get('href') for link in parser.links
                           if link.get('rel') == 'canonical']
              if canonical != [f'https://borjamartin.com/{language}/']:
                  errors.append(f'{name}: expected one canonical URL for /{language}/')
              for alternate in ('es', 'en'):
                  urls = [link.get('href') for link in parser.links
                          if link.get('rel') == 'alternate' and link.get('hreflang') == alternate]
                  if urls != [f'https://borjamartin.com/{alternate}/']:
                      errors.append(f'{name}: expected one hreflang="{alternate}" link to /{alternate}/')

          if errors:
              print('Website validation failed:')
              for error in errors:
                  print(f'- {error}')
              sys.exit(1)

          print(f'Validation passed: {len(pages)} pages; Spanish and English metadata checked.')
          PY

      - name: Reject obvious placeholders
        shell: bash
        run: |
          if grep -RniE '(^|[^[:alnum:]_])(TODO|TBD)([^[:alnum:]_]|$)|LOREM IPSUM|example\.com' publicar/; then
            echo 'ERROR: placeholder content found in publicar/'
            exit 1
          fi

      - name: Confirm website entry point is non-empty
        shell: bash
        run: |
          test -s publicar/index.html
